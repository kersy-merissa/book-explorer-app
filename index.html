<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Explorer - Phase 1 Capstone</title>
    <!-- Tailwind CSS CDN for styling (Lab 1) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- ========================================== -->
    <!-- LAB 1: RESPONSIVE LAYOUT & NAVIGATION      -->
    <!-- ========================================== -->
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">📚 Book Explorer</h1>
            <nav class="space-x-4">
                <a href="#" class="hover:underline">Home</a>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="max-w-4xl mx-auto p-4 flex-grow w-full">
        
        <!-- Intro text section -->
        <div class="text-center my-6">
            <h2 class="text-2xl font-bold text-gray-800">Find Your Favorite Books</h2>
            <p class="text-gray-600">Search books from the Open Library API or explore samples below.</p>
        </div>

        <!-- ========================================== -->
        <!-- LAB 3: API SEARCH INPUT & BUTTON           -->
        <!-- ========================================== -->
        <div class="bg-white p-4 rounded-lg shadow mb-6 flex gap-2">
            <!-- Search input where user types the book title -->
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Type a book title (e.g., JavaScript)..." 
                class="flex-1 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <!-- Button to trigger the search action -->
            <button 
                id="searchBtn" 
                class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition"
            >
                Search
            </button>
        </div>

        <!-- ========================================== -->
        <!-- LAB 2 & 3: DYNAMIC RESULTS CONTAINER       -->
        <!-- ========================================== -->
        <div>
            <h3 class="text-lg font-semibold mb-3 text-gray-700">Book Results</h3>
            <!-- JavaScript will dynamically insert book cards here -->
            <div id="resultsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            </div>
        </div>

    </main>

    <!-- FOOTER (Lab 1) -->
    <footer class="bg-white border-t p-4 text-center text-sm text-gray-500">
        <p>&copy; 2026 Book Explorer. All rights reserved.</p>
    </footer>

    <!-- Linking the JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
