<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Explorer - Home</title>
    <!-- Tailwind CSS CDN: Styles our app instantly without needing complex CSS files -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./src/css/input.css">
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- Lab 1: Exercise 1.1 - Navigation Bar Component -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">📚 Book Explorer</h1>
            <nav class="space-x-6">
                <!-- Multi-page navigation links -->
                <a href="index.html" class="hover:underline font-semibold">Home</a>
                <a href="favorites.html" class="hover:underline">Favorites</a>
                <a href="about.html" class="hover:underline">About</a>
            </nav>
        </div>
    </header>

    <!-- Lab 1: Exercise 1.1 - Hero Section & Lab 3: Exercise 3.3 - Search Input -->
    <section class="bg-indigo-50 py-12 px-4 text-center">
        <div class="max-w-3xl mx-auto">
            <h2 class="text-3xl sm:text-4xl font-extrabold text-indigo-900 mb-4">Discover Your Next Favorite Book</h2>
            <p class="text-gray-600 text-base sm:text-lg mb-6">Explore thousands of books instantly using the Open Library API.</p>
            
            <!-- Search bar container for querying books by title -->
            <div class="flex flex-col sm:flex-row justify-center gap-2">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search books by title (e.g., JavaScript)..." 
                    class="px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-96 shadow-sm"
                >
                <button 
                    id="searchBtn" 
                    class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-indigo-700 transition shadow-sm">
                    Search
                </button>
            </div>
        </div>
    </section>

    <!-- Main Content Grid -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <h3 class="text-2xl font-bold mb-6 text-gray-800">Featured Books</h3>
        
        <!-- Lab 3: Exercise 3.4 - Loading Spinner State (Hidden by default) -->
        <div id="loadingSpinner" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent"></div>
            <p class="text-gray-500 mt-2">Loading books...</p>
        </div>

        <!-- Lab 1: Exercise 1.2 & 1.3 - Responsive Grid (Mobile-first layout: 1 col mobile, 2 tablet, 4 desktop) -->
        <div id="bookGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

        <!-- Lab 3: Exercise 3.4 - No Results State Message -->
        <p id="noResults" class="hidden text-center text-gray-500 py-12 text-lg">No books found matching your search.</p>
    </main>

    <!-- Footer Component -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500">
        <p>&copy; 2026 Book Explorer Capstone.</p>
    </footer>

    <!-- Main JavaScript Module Entry Point -->
    <script type="module" src="./src/js/main.js"></script>
</body>
</html>
