<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Explorer - Phase 1 Capstone</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- HEADER / NAVIGATION (Lab 1) -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">📚 Book Explorer App</h1>
            <nav class="space-x-4">
                <a href="#" class="hover:underline">Home</a>
                <a href="#" class="hover:underline">About</a>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="container mx-auto px-4 py-6 flex-grow">
        
        <!-- INTRO SECTION (Lab 1) -->
        <section class="mb-6 text-center">
            <h2 class="text-2xl font-bold text-blue-800">Explore and Discover Books</h2>
            <p class="text-gray-600 mt-1">Search books from the Open Library or browse samples below.</p>
        </section>

        <!-- LAB 3: Search Input and Dynamic Results Container -->
        <section class="my-6 max-w-2xl mx-auto bg-white p-4 rounded-lg shadow-sm border border-gray-200">
            <div class="flex gap-2">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Type a book title (e.g., JavaScript)..." 
                    class="flex-1 p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                <button 
                    id="searchBtn" 
                    class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition"
                >
                    Search
                </button>
            </div>
        </section>

        <!-- RESULTS / BOOKS CONTAINER (Lab 2 & Lab 3 shared display) -->
        <section>
            <h3 class="text-lg font-semibold mb-3 text-gray-700">Results / Book List</h3>
            <div id="resultsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- JavaScript will dynamically insert book items here -->
            </div>
        </section>
    </main>

    <!-- FOOTER (Lab 1) -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center text-sm text-gray-500">
        <p>&copy; 2026 Book Explorer. Built with Tailwind CSS & JavaScript.</p>
    </footer>

    <!-- JavaScript Link -->
    <script src="script.js"></script>
</body>
</html>
